        const summaryData = [{"key": "福建／閩南", "name": "福建／閩南群 (Hokkien)", "color": "#dc2626", "badgeBg": "#fee2e2", "badgeText": "#991b1b", "desc": "泉州、漳州、永春、龍巖、興化(莆仙)、福州等閩籍各屬", "geoCount": 23, "ungeoCount": 2, "totalCount": 25}, {"key": "廣東廣府／四邑", "name": "廣東廣府／四邑群 (Cantonese)", "color": "#2563eb", "badgeBg": "#dbeafe", "badgeText": "#1e40af", "desc": "廣州府(番禺/南海/順德/香山/東莞)、肇慶府、四邑(台山/新會/開平/恩平)", "geoCount": 15, "ungeoCount": 0, "totalCount": 15}, {"key": "客家", "name": "客家族群 (Hakka)", "color": "#059669", "badgeBg": "#d1fae5", "badgeText": "#065f46", "desc": "粵東嘉應州(梅縣)、惠州府、海陸豐、閩西汀州府(永定)、大埔(茶陽)", "geoCount": 11, "ungeoCount": 2, "totalCount": 13}, {"key": "海南", "name": "海南族群 (Hainanese)", "color": "#0284c7", "badgeBg": "#e0f2fe", "badgeText": "#075985", "desc": "瓊州府及海南島各屬移民", "geoCount": 12, "ungeoCount": 3, "totalCount": 15}, {"key": "潮州", "name": "潮州族群 (Teochew)", "color": "#d97706", "badgeBg": "#fef3c7", "badgeText": "#92400e", "desc": "潮州府八邑及韓江流域移民", "geoCount": 3, "ungeoCount": 0, "totalCount": 3}, {"key": "跨方言聯合", "name": "跨方言聯合會館 (Multi-dialect)", "color": "#4f46e5", "badgeBg": "#e0e7ff", "badgeText": "#3730a3", "desc": "跨省或跨方言群體共組會館 (如廣東暨汀州、廣肇惠、增龍客家等)", "geoCount": 5, "ungeoCount": 1, "totalCount": 6}, {"key": "廣東通屬／雷州", "name": "廣東通屬／雷州 (General Kuangtung)", "color": "#9333ea", "badgeBg": "#f3e8ff", "badgeText": "#6b21a8", "desc": "廣東全省跨方言總會館及雷州府地緣會館", "geoCount": 2, "ungeoCount": 0, "totalCount": 2}, {"key": "廣西", "name": "廣西省籍 (Kwangsi)", "color": "#e11d48", "badgeBg": "#ffe4e6", "badgeText": "#9f1239", "desc": "廣西各屬同鄉移民會館", "geoCount": 1, "ungeoCount": 1, "totalCount": 2}];

        let map;
        let leafletMarkers = [];
        let currentFilter = 'ALL';

        // 1. 初始化 Leaflet 地圖
        function initMap() {
            // 中心點設定在馬來西亞（涵蓋西馬與東馬）
            map = L.map('map', {
                zoomControl: true,
                attributionControl: true
            }).setView([4.2105, 108.9758], 6);

            // 採用深色現代向量地圖樣式 (CartoDB Dark Matter)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a> | 資料: <a href="https://nanyang-data.info/">Nanyang Data</a>',
                maxZoom: 19
            }).addTo(map);

            renderMarkers(markersData);
        }

        // 2. 渲染地圖 Marker
        function renderMarkers(data) {
            // 清空舊標記
            leafletMarkers.forEach(m => map.removeLayer(m));
            leafletMarkers = [];

            data.forEach(s => {
                // 圓點自訂外觀
                const marker = L.circleMarker([s.lat, s.lng], {
                    radius: 7,
                    fillColor: s.color,
                    color: '#ffffff',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.9,
                    className: 'custom-marker'
                });

                const popupHtml = `
                    <div class="text-slate-800 text-xs min-w-[220px] max-w-[280px]">
                        <div class="flex items-center justify-between gap-2 mb-1.5">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold" style="background-color: ${s.badgeBg}; color: ${s.badgeText}">
                                ${s.groupName}
                            </span>
                            <span class="text-[10px] font-mono text-slate-400">${s.id}</span>
                        </div>
                        <h3 class="font-bold text-sm text-slate-900">${s.nameZh}</h3>
                        <p class="text-[11px] text-slate-600 italic mb-2">${s.nameAlt}</p>
                        
                        <div class="space-y-1 bg-slate-50 p-2 rounded-lg border border-slate-100 text-[11px]">
                            <div><strong>最早銘刻年份</strong>: <span class="font-mono text-amber-700 font-bold">${s.year} 年</span></div>
                            <div><strong>傅吾康編號</strong>: <span class="font-mono text-slate-600">${s.frankeNo}</span></div>
                            <div class="text-slate-600 line-clamp-2"><strong>地址</strong>: ${s.address}</div>
                        </div>

                        ${s.notes ? `<p class="mt-1.5 text-[10px] text-slate-500 bg-amber-50/80 p-1.5 rounded border border-amber-200/50">💡 ${s.notes}</p>` : ''}

                        <div class="mt-2.5 pt-2 border-t border-slate-100 flex items-center justify-between text-[10px]">
                            <a href="https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}" target="_blank" class="text-indigo-600 hover:underline flex items-center gap-0.5">
                                📍 在 Google 地圖開啟 ↗
                            </a>
                        </div>
                    </div>
                `;

                marker.bindPopup(popupHtml);
                marker.siteData = s;
                marker.addTo(map);
                leafletMarkers.push(marker);
            });
        }

        // 3. 產生地圖頂部過濾膠囊 (Pills)
        function renderFilterPills() {
            const container = document.getElementById('pillsContainer');
            container.innerHTML = '';

            summaryData.forEach(g => {
                const btn = document.createElement('button');
                btn.id = `pill-${g.key}`;
                btn.className = 'pill-btn shrink-0 px-3 py-1 rounded-full text-xs font-medium text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 border border-slate-700 transition flex items-center gap-1.5';
                btn.onclick = () => filterGroup(g.key);
                btn.innerHTML = `
                    <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${g.color}"></span>
                    <span>${g.name.split(' ')[0]}</span>
                    <span class="text-[10px] px-1.5 py-0.2 rounded-full bg-slate-900/80 text-slate-400 font-mono">${g.geoCount}</span>
                `;
                container.appendChild(btn);
            });
        }

        // 4. 原鄉過濾邏輯
        function filterGroup(groupKey) {
            currentFilter = groupKey;
            
            // 更新膠囊高亮樣式
            document.querySelectorAll('.pill-btn').forEach(b => {
                b.classList.remove('active', 'bg-white', 'text-slate-900', 'font-semibold');
                b.classList.add('bg-slate-800', 'text-slate-300', 'font-medium');
            });

            const activeBtn = document.getElementById(`pill-${groupKey}`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-slate-800', 'text-slate-300', 'font-medium');
                activeBtn.classList.add('active', 'bg-white', 'text-slate-900', 'font-semibold');
            }

            let filtered = markersData;
            if (groupKey !== 'ALL') {
                filtered = markersData.filter(s => s.groupKey === groupKey);
            }

            renderMarkers(filtered);
            renderSidebarList(filtered);

            // 更新標籤與統計
            document.getElementById('visibleCountBadge').innerText = `顯示 ${filtered.length} / 81 處`;
            document.getElementById('mobileCount').innerText = filtered.length;

            if (groupKey === 'ALL') {
                document.getElementById('activeGroupLabel').innerText = '';
                resetView();
            } else {
                document.getElementById('activeGroupLabel').innerText = `• ${groupKey}`;
                // 自動縮放以適應該群組的所有點位
                if (filtered.length > 0) {
                    const groupBounds = L.latLngBounds(filtered.map(s => [s.lat, s.lng]));
                    map.fitBounds(groupBounds, { padding: [40, 40], maxZoom: 12 });
                }
            }
        }

        // 5. 渲染側邊欄清單
        function renderSidebarList(data) {
            const list = document.getElementById('siteList');
            list.innerHTML = '';

            if (data.length === 0) {
                list.innerHTML = `<div class="text-center py-8 text-xs text-slate-500">查無相符的會館點位</div>`;
                return;
            }

            data.forEach(s => {
                const card = document.createElement('div');
                card.className = 'bg-slate-900/80 hover:bg-slate-800/90 p-3 rounded-xl border border-slate-800 hover:border-slate-700 transition cursor-pointer text-xs space-y-1';
                card.onclick = () => focusSite(s.id);
                card.innerHTML = `
                    <div class="flex items-center justify-between gap-1.5">
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold" style="background-color: ${s.badgeBg}; color: ${s.badgeText}">
                            ${s.groupName.split(' ')[0]}
                        </span>
                        <span class="font-mono text-[10px] text-amber-500">${s.year !== '未知' ? s.year + '年' : ''}</span>
                    </div>
                    <h4 class="font-bold text-white text-sm mt-1">${s.nameZh}</h4>
                    <p class="text-[11px] text-slate-400 truncate">${s.nameAlt}</p>
                    <p class="text-[10px] text-slate-500 truncate">📍 ${s.address}</p>
                `;
                list.appendChild(card);
            });
        }

        // 6. 點擊清單項目聚焦地圖 Marker
        function focusSite(siteId) {
            const marker = leafletMarkers.find(m => m.siteData.id === siteId);
            if (marker) {
                map.flyTo([marker.siteData.lat, marker.siteData.lng], 14, { duration: 1 });
                setTimeout(() => marker.openPopup(), 1000);
            }
        }

        // 7. 關鍵字即時搜尋
        function searchSites() {
            const q = document.getElementById('mapSearch').value.trim().toLowerCase();
            let base = markersData;
            if (currentFilter !== 'ALL') {
                base = markersData.filter(s => s.groupKey === currentFilter);
            }

            const filtered = base.filter(s => 
                s.nameZh.toLowerCase().includes(q) || 
                s.nameAlt.toLowerCase().includes(q) || 
                s.address.toLowerCase().includes(q) || 
                s.groupName.toLowerCase().includes(q)
            );

            renderMarkers(filtered);
            renderSidebarList(filtered);
            document.getElementById('visibleCountBadge').innerText = `搜尋結果 ${filtered.length} 處`;
        }

        // 8. 渲染未定標清單
        function renderUnlocatedList() {
            const container = document.getElementById('unlocatedList');
            container.innerHTML = '';
            unlocatedData.forEach(s => {
                const item = document.createElement('div');
                item.className = 'bg-slate-950 p-2 rounded border border-slate-800 text-[11px]';
                item.innerHTML = `
                    <div class="flex items-center justify-between text-slate-300">
                        <strong class="text-white">${s.nameZh}</strong>
                        <span class="text-[10px] px-1.5 py-0.5 rounded" style="background-color: ${s.badgeBg}; color: ${s.badgeText}">${s.groupKey}</span>
                    </div>
                    <div class="text-[10px] text-slate-400 mt-0.5">${s.nameAlt}</div>
                    <div class="text-[10px] text-slate-500 font-mono mt-0.5">編號: ${s.frankeNo} (年代: ${s.year})</div>
                `;
                container.appendChild(item);
            });
        }

        function toggleUnlocatedDrawer() {
            const drawer = document.getElementById('unlocatedDrawer');
            const icon = document.getElementById('unlocatedToggleIcon');
            drawer.classList.toggle('hidden');
            icon.innerText = drawer.classList.contains('hidden') ? '▼' : '▲';
        }

        function resetView() {
            map.setView([4.2105, 108.9758], 6);
        }

        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            renderFilterPills();
            renderSidebarList(markersData);
            renderUnlocatedList();
        });
    </script>
</body>
</html>
